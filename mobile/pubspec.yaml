name: ivrivrii_chicken
description: "Ivrivrii Chicken - commande en ligne et administration du restaurant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.1.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  geolocator: ^11.1.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.jpg
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.jpg
  adaptive_icon_foreground_inset: 16
